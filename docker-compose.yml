version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/storage
    environment:
      PROJECT_NAME: Signal Clone Backend
      ENVIRONMENT: development
      SECRET_KEY: DEVELOPMENT_SUPER_SECRET_KEY_987654321
      DATABASE_BACKEND: sqlite
      SQLITE_DATABASE_PATH: /app/signal_clone.db
      REDIS_BACKEND: memory
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  backend-data:
